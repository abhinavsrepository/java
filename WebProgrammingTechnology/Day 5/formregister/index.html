<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
      //to validate password and confirm password matches
      function checkpasswords(id,cid,errid){
          var pass=document.getElementById(id).value;
          var cpass=document.getElementById(cid).value;
          //alert(pass+"-----"+cpass)
          if(pass!=="" && cpass!=="" && pass.trim().length>0 && cpass.trim().length>0 &&pass.trim()==cpass.trim()){
            //remove the error message if no error
            document.getElementById(errid).innerHTML="";
            return true;
          }
          //display the error message if the error exists
          document.getElementById(errid).innerHTML="password and confirm password does not match"
          //clear the textboxes
          document.getElementById(id).value="";
          document.getElementById(cid).value="";
          return false;
      }
      //validate whether minimum 3 hobbies are selected or not
      function validatecheckboxes(nm,errid){
        arr=document.getElementsByName(nm)
        var cnt=0;
        var str="";
        for(var i=0;i<arr.length;i++){
            if(arr[i].checked){
             // alert(arr[i].value)
              cnt++;
             /* if(cnt>=3){
                return true;
              }*/
              str+=arr[i].value+",";
            }
        }
        console.log(str);
        //alert("count: "+cnt);
        if(cnt>=3){
          document.getElementById(errid).innerHTML="";
          return true;
        }
        document.getElementById(errid).innerHTML="pls selecet minimum 3 "+nm;
        return false;
      }
      //validate whether 1 degree is selcetd or not
      function validateRadioButton(nm,errid){
        var arr=document.getElementsByName(nm);
        for(var i=0;i<arr.length;i++){
           if(arr[i].checked){
            document.getElementById(errid).innerHTML="";
            return true;
           }
        }
        document.getElementById(errid).innerHTML="Pls select "+nm;
        return false;
      }
      //to check whether city is selected or not
      function validatedropdown(id,errid){
        var ct=document.getElementById(id)
        //index of selected option
        var pos=ct.selectedIndex;
        //value of selected element
        var val=ct.options[pos].value;
        if(pos!==0){
          document.getElementById(errid).innerHTML="";
          return true;
        }
        document.getElementById(errid).innerHTML="pls select city";
        return false;
      }
      function validatedata(){
        flag=checkpasswords("pass","cpass","errcpass");
        flag1=validatecheckboxes("hobbies","errhobbies")
        flag2=validateRadioButton("degree","errdegree")
        flag3=validateRadioButton("gender","errgender")
        flag4=validatedropdown("ct","errct")
        return flag && flag1 && flag2 && flag3 && flag4;
      }
    </script>
</head>
<body>
    <table>
        <form method="post" action="registerdata" onsubmit="return validatedata()">
          <tr>
            <td><label for="nm">Name:</label> </td>
            <td>
                <input type="text" name="name" id="nm" placeholder="enter name"/>
            </td>
          </tr>
          <tr>

            </td>
          </tr>
          <tr>

                <textarea name="addr" id="addr" rows="5" cols="20"></textarea>
            </td>
          </tr>
          <tr>
            <td><label for="addr">Address</label></td>

                https://<textarea name="addr" id="addr" rows="5" cols="20" text="xyz road">visible text</textarea>
            </td>
          </tr>
          <tr>
            <td><label for="unm">username</label></td>
            <td><input type="text" name="uname" id="unm" placeholder="enter username"></td>

          <tr>

            <input type="radio" name="gender" id="male" value="male"/><label for="male">male</label></td>
            <td id="errgender"></td>
          </tr>
          <tr>
            <td><label>Degree</label></td>

                <input type="radio" name="degree" id="BE" value="BE"/><label for="BE">BE</label>

                <input type="radio" name="degree" id="BTech" value="BTech"/><label for="BTech">BTech</label>

                <input type="radio" name="degree" id="MTech" value="MTech"/><label for="MTech">MTech</label>

          <tr>

            </td>

                <select name="city" id="ct">
                   <option value="test">-----select one---</option>

                </select>
            </td>

          </tr>
          <tr>

          </tr>
          <tr>
            <td></td>

                <button type="submit" name="btn" id="submit" value="submit">Register me</button>

                <button type="reset" name="btn" id="reset" value="reset">Cancel</button>
            </td>
          </tr>
        </form>
    </table>
</body>
</html>
