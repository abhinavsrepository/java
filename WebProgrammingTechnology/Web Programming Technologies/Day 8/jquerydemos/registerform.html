    <script>
      function validatepassword(id,cid,errid){
        var p=$('#'+id).val();
        var cp=$('#'+cid).val();
        if(p!=="" && cp!=="" && p.trim().length>0 && cp.trim().length>0 && p.trim()===cp.trim()){
          $('#'+errid).html("");
           return true;
        }
        $('#'+errid).html("password and confirm password does not match");
           return false;
      }
      function validatecheckboxes(nm,errid){
        var cnt=0
        var str="";
        /*$('input[name='+nm+']').each(function(index,element){

              }

        })
        if(cnt>=3){
           $('#'+errid).html("")
           return true
        }
        else{
          $('#'+errid).html("pls select 3 hobbies")
          return false;
        }      
        */
        var arr=$('input[name='+nm+']:checked')
        //alert(arr.length)
        if(arr.length>=3){
           $('#'+errid).html("")
           return true
        }
        else{
          $('#'+errid).html("pls select 3 hobbies")
          return false;
        }
           

      }
      $(document).ready(function(){
        $('#myfrm').submit(function(){
             flag=validatepassword("pass","cpass","errcpass")
             flag1=validatecheckboxes("hobbies","errhobbies")
             return flag && flag1;
        })
      })
