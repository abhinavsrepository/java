<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./scripts/jquery.js"></script>
    <script>
      function validatepassword(id,cid,errid){
        //retrieve the value of pass and cpass text boxes
        var p=$('#'+id).val();
        var cp=$('#'+cid).val();
        //validate data
        if(p!=="" && cp!=="" && p.trim().length>0 && cp.trim().length>0 && p.trim()===cp.trim()){
          $('#'+errid).html("");
           return true;
        }
        $('#'+errid).html("password and confirm password does not match");
           return false;
      }
      function validatecheckboxes(nm,errid){
        var cnt=0
        var str="";
        /*$('input[name='+nm+']').each(function(index,element){
            if($(element).is(':checked')){  //prop
              cnt++;
              str+=$(element).val()+",";
              }

        })
        if(cnt>=3){
           $('#'+errid).html("")
           return true
        }
        else{
          $('#'+errid).html("pls select 3 hobbies")
          return false;
        }      
        */
       //to select only checked checkboxes
        var arr=$('input[name='+nm+']:checked')
        //alert(arr.length)
        if(arr.length>=3){
           $('#'+errid).html("")
           return true
        }
        else{
          $('#'+errid).html("pls select 3 hobbies")
          return false;
        }
           

      }
      //validate username
      function validateTextBox(id,errid){
        var v=$('#'+id).val();
        if(v=="" || v.trim().length<7 || v.includes(" ")) 
        {
           $('#'+errid).html("username cannot contain spaces, and length shoulbe = 7")
           //alert("in if")
           return false;
        }
        //alert("in else")
        $('#'+errid).html("")
        return true;

      }
      //to validate gender and degree atleast one option for each group is selected
      const validateradio=(nm,errid)=>{
          var v=$('input[name='+nm+']:checked').val();
          if(v===undefined){
            //alert("in if")
             $('#'+errid).html("pls select one "+nm);
             return false
          }
          //alert("in else")
          $('#'+errid).html("");
             return true;
      }
      //to check that the city is selected
      const validateDropDown=(id,errid)=>{
        alert("string : "+'#'+id+' option:selected')
        var v=$('#'+id+' option:selected').val(); 
        if(v==='test') {
          $('#'+errid).html("pls select city")
          return false
        }
        $('#'+errid).html("")
          return true
      }

      $(document).ready(function(){
        $('#myfrm').submit(function(event){
          event.preventDefault();
             flag=validatepassword("pass","cpass","errcpass")
             flag1=validatecheckboxes("hobbies","errhobbies")
             flag2=validateTextBox("unm","errunm")
             flag3=validateradio("degree","errdegree");
             flag4=validateDropDown("ct","errcity")
             return flag && flag1 && flag2 && flag3 && flag4;
        })
      })
    </script>
</head>
<body>
    <table>

          <tr>

          <tr>
