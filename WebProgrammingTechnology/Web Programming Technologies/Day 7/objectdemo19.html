   <script>
     class Person{
        constructor(pid,pname,mob){
            this.pid=pid;
            this.pname=pname;
            this.mob=mob;
        }
        display(){
            return `Id: ${this.pid} Name: ${this.name} mobile: ${this.mobile}`
        }
     }
     class Employee extends Person{
        constructor(pid,nm,m,dept,desg){
            super(pid,nm,m)

            this.desg=desg;
        }
        display(){
            return super.display()+` department: ${this.dept} desg: ${this.desg}` 
        }
     }
